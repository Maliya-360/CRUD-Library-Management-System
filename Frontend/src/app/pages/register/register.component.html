<div class="register-container">
  <div class="register-card">
    <h2>📚 Library Management System</h2>
    <h3>Register <span class="angular-badge">Angular Frontend</span></h3>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>First Name</label>
        <input type="text" [(ngModel)]="firstName" name="firstName" required />
      </div>
      <div class="form-group">
        <label>Last Name</label>
        <input type="text" [(ngModel)]="lastName" name="lastName" required />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="email" name="email" required />
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input type="tel" [(ngModel)]="phone" name="phone" required />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" [(ngModel)]="password" name="password" required />
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" required />
      </div>
      <button type="submit" [disabled]="loading()">{{ loading() ? 'Registering...' : 'Register' }}</button>
    </form>

    <p class="login-link">
      Already have an account?
      <a routerLink="/login">Login here</a>
    </p>
  </div>
</div>
